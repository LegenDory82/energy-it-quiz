<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy-IT Quiz Stufe 1</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;margin:0;padding:16px}
.box{max-width:680px;margin:auto;background:#1e293b;padding:20px;border-radius:14px}
.opt{display:block;width:100%;padding:14px;margin:10px 0;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:10px;text-align:left;font-size:15px}
.ok{background:#064e3b!important;border-color:#10b981!important}
.no{background:#7f1d1d!important;border-color:#ef4444!important}
#fb{padding:12px;background:#0f172a;border-left:4px solid #38bdf8;margin-top:12px;display:none;font-size:14px}
#nxt{padding:12px 20px;background:#0284c7;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:14px;display:none}
</style>
</head>
<body>
<div class="box">
  <div id="st" style="color:#38bdf8;font-size:13px;font-weight:bold">FRAGE 1 / 8</div>
  <h3 id="qt">Welche Marktrolle hält in Deutschland die 50-Hz-Netzfrequenz und betreibt das Höchstspannungsnetz?</h3>
  <button type="button" class="opt" id="o0" onclick="hit(0)">Übertragungsnetzbetreiber (ÜNB)</button>
  <button type="button" class="opt" id="o1" onclick="hit(1)">Verteilnetzbetreiber (VNB)</button>
  <button type="button" class="opt" id="o2" onclick="hit(2)">Lieferant / Stromversorger</button>
  <button type="button" class="opt" id="o3" onclick="hit(3)">Messstellenbetreiber (MSB)</button>
  <div id="fb"></div>
  <button type="button" id="nxt" onclick="go()">Nächste Frage ➔</button>
</div>
<script>
var db=[
{q:"Welche Marktrolle hält in Deutschland die 50-Hz-Netzfrequenz und betreibt das Höchstspannungsnetz?",o:["Übertragungsnetzbetreiber (ÜNB)","Verteilnetzbetreiber (VNB)","Lieferant / Stromversorger","Messstellenbetreiber (MSB)"],c:0,e:"Richtig! Die 4 ÜNBs (Amprion, TenneT, 50Hertz, TransnetBW) sichern die Systemstabilität."},
{q:"Welche Mindestleistung muss nach § 14a EnWG bei einem Dimm-Eingriff pro steuerbarem Gerät (>4,2 kW) verbleiben?",o:["0,0 kW","4,2 kW","2,3 kW","11,0 kW"],c:1,e:"Exakt! 4,2 kW ist sowohl die Eintrittsschwelle als auch der garantierte Mindest-Sockel."},
{q:"Welche Schnittstelle am Smart Meter Gateway bildet die sichere Brücke ins Kundennetz (Steuerbox/HEMS)?",o:["LMN-Port","RS-485","CLS-Schnittstelle","WAN-Modem"],c:2,e:"Perfekt! Über CLS (Controllable Local System) laufen alle verschlüsselten Steuerbefehle."},
{q:"Warum zielt unsere B2B-Strategie primär auf Multiplikatoren wie Thüga, SIV.AG oder Kiwigrid?",o:["Stadtwerke sind von NIS-2 befreit","Ein Plattform-Abschluss öffnet hunderte Stadtwerke gleichzeitig","Plattformen brauchen keine Audits","Stadtwerke dürfen keine IT einkaufen"],c:1,e:"Volltreffer! Plattform-Enabler skalieren unsere Lösungen ohne lange Einzel-Vergaben."},
{q:"Was unterscheidet EEBUS architektonisch von klassischem Modbus TCP?",o:["EEBUS nutzt semantische Use-Cases (SPINE) statt starrer Register-Tabellen","Modbus ist kabellos","EEBUS ist vom BSI vorgeschrieben","Modbus überträgt keine Leistung"],c:0,e:"Richtig! EEBUS ermöglicht herstellerübergreifendes Plug-and-Play im HEMS."},
{q:"Was verhängte die BNetzA im Nov. 2026 gegen 72 Messstellenbetreiber wegen verfehlter 20%-iMSys-Quote?",o:["Konzessionsentzug","1,4 Mio. € Zwangsgeld (Frist Juni 2027, sonst 5-fach)","Verbot dynamischer Tarife","Verstaatlichung"],c:1,e:"Genau! Bis Juni 2027 droht die Verfünffachung – ein massiver Hebel für unsere Assessments."},
{q:"Was darf ein HEMS laut BNetzA-Beschlusskammer 6 bei einem Dimm-Befehl für mehrere Geräte tun?",o:["Nur 50:50 aufteilen","Wärmepumpe abschalten","Leistung dynamisch nach Bedarf priorisieren","Gar nicht bündeln"],c:2,e:"Stark! Dynamische Priorisierung verhindert verschenkte Ladeleistung."},
{q:"Welche Konsequenz droht Geschäftsführern bei Verstößen gegen NIS-2-Pflichten?",o:["Nur Rüge","Persönliche Haftung & bis zu 10 Mio. € Bußgeld","Nur Warnung für Admins","Keine"],c:1,e:"Korrekt! Persönliche C-Level-Haftung ist unser stärkstes Vertriebsargument."}
];
var i=0,p=0,lock=0;
function show(){lock=0;var x=db[i];document.getElementById("st").textContent="FRAGE "+(i+1)+" / "+db.length+" | PUNKTE: "+p;document.getElementById("qt").textContent=x.q;document.getElementById("fb").style.display="none";document.getElementById("nxt").style.display="none";for(var k=0;k<4;k++){var b=document.getElementById("o"+k);b.className="opt";b.textContent=x.o[k];}}
function hit(k){if(lock)return;lock=1;var x=db[i];document.getElementById("o"+x.c).className="opt ok";if(k===x.c)p++;else document.getElementById("o"+k).className="opt no";document.getElementById("st").textContent="FRAGE "+(i+1)+" / "+db.length+" | PUNKTE: "+p;var f=document.getElementById("fb");f.textContent=x.e;f.style.display="block";document.getElementById("nxt").style.display="inline-block";}
function go(){i++;if(i<db.length)show();else{document.getElementById("qt").textContent="Fertig! Dein Ergebnis: "+p+" von "+db.length+" Punkten.";for(var k=0;k<4;k++)document.getElementById("o"+k).style.display="none";document.getElementById("fb").style.display="none";document.getElementById("nxt").textContent="Neu starten";document.getElementById("nxt").onclick=function(){location.reload();};}}
</script>
</body>
</html>
